<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="抛物方程的初始场、步进与边界"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6994a8"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="30" y="44" font-size="25" fill="#163f58" text-anchor="start">抛物方程的初始场、步进与边界</text><text x="30" y="75" font-size="14" fill="#5e7d8e" text-anchor="start">这是数值方法结构示意，没有执行任何海域仿真或给出误差保证。</text><rect x="65" y="122" width="670" height="260" fill="#e3f2f9"/><rect x="65" y="337" width="670" height="45" fill="#e2e1e2"/><line x1="120" y1="150" x2="120" y2="328" stroke="#6a9dae" stroke-width="2" stroke-dasharray="5 4"/><text x="120" y="112" font-size="17" fill="#294c65" text-anchor="middle">初始场</text><line x1="350" y1="150" x2="350" y2="328" stroke="#6a9dae" stroke-width="2" stroke-dasharray="5 4"/><text x="350" y="112" font-size="17" fill="#294c65" text-anchor="middle">距离步进</text><line x1="600" y1="150" x2="600" y2="328" stroke="#6a9dae" stroke-width="2" stroke-dasharray="5 4"/><text x="600" y="112" font-size="17" fill="#294c65" text-anchor="middle">下一个截面</text><line x1="145" y1="225" x2="315" y2="225" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="380" y1="225" x2="550" y2="225" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="400" y="184" font-size="18" fill="#294c65" text-anchor="middle">标准 / 宽角近似 → 传播算子 → 数值离散</text><text x="400" y="291" font-size="17" fill="#294c65" text-anchor="middle">分裂步法交替处理传播与介质项；须核对步长误差。</text><text x="400" y="366" font-size="16" fill="#294c65" text-anchor="middle">人工吸收层：减小计算边界反射，不能代替物理海底。</text><text x="400" y="413" font-size="15" fill="#294c65" text-anchor="middle">单向步进近似通常忽略后向散射；适用角度由具体算子决定。</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>