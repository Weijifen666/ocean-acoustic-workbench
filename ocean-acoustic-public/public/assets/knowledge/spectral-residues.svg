<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="复波数平面与模态留数"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6994a8"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="30" y="44" font-size="25" fill="#163f58" text-anchor="start">复波数平面与模态留数</text><text x="30" y="75" font-size="14" fill="#5e7d8e" text-anchor="start">仅示意谱表示之间的联系；极点位置与积分路径不代表实际模型。</text><line x1="90" y1="304" x2="710" y2="304" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="130" y1="375" x2="130" y2="120" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="710" y="331" font-size="16" fill="#294c65" text-anchor="start">Re kᵣ</text><text x="92" y="122" font-size="16" fill="#294c65" text-anchor="start">Im kᵣ</text><path d="M190 304C200 130 620 130 655 304" fill="none" stroke="#318aa6" stroke-width="3" stroke-dasharray="7 5"/><circle cx="275" cy="265" r="7" fill="#a477a1"/><circle cx="420" cy="265" r="7" fill="#a477a1"/><circle cx="560" cy="265" r="7" fill="#a477a1"/><text x="420" y="156" font-size="17" fill="#294c65" text-anchor="middle">满足解析与辐射条件时的围线变形</text><text x="420" y="367" font-size="19" fill="#294c65" text-anchor="middle">离散极点的留数 ↔ 离散模态贡献</text><text x="400" y="408" font-size="15" fill="#294c65" text-anchor="middle">支点、支割与连续谱也需处理，不能只保留极点。</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>