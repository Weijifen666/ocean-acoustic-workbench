<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="镜像法与海面反射"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6994a8"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="30" y="44" font-size="25" fill="#163f58" text-anchor="start">镜像法与海面反射</text><text x="30" y="75" font-size="14" fill="#5e7d8e" text-anchor="start">镜像源是数学构造，不是真实声源；此处只画一个理想压力释放面。</text><rect x="65" y="240" width="670" height="160" fill="#e0f1fa"/><line x1="65" y1="240" x2="735" y2="240" stroke="#3488a4" stroke-width="2" stroke-dasharray=""/><text x="725" y="228" font-size="16" fill="#294c65" text-anchor="end">p = 0 海面</text><circle cx="190" cy="150" r="8" fill="#b489b4"/><circle cx="190" cy="330" r="8" fill="#2788a1"/><circle cx="655" cy="330" r="8" fill="#267c9a"/><line x1="190" y1="150" x2="655" y2="330" stroke="#b489b4" stroke-width="2" stroke-dasharray="6 5"/><line x1="190" y1="330" x2="655" y2="330" stroke="#2788a1" stroke-width="2" stroke-dasharray=""/><line x1="190" y1="330" x2="423" y2="240" stroke="#2788a1" stroke-width="2" stroke-dasharray=""/><line x1="423" y1="240" x2="655" y2="330" stroke="#2788a1" stroke-width="2" stroke-dasharray=""/><text x="210" y="150" font-size="17" fill="#294c65" text-anchor="start">反相镜像源 −S</text><text x="106" y="371" font-size="17" fill="#294c65" text-anchor="start">实际声源 S</text><text x="630" y="371" font-size="17" fill="#294c65" text-anchor="start">接收点</text><text x="400" y="117" font-size="17" fill="#294c65" text-anchor="middle">均匀半空间：用镜像源满足理想海面的边界条件</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>