<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Pekeris 波导"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6994a8"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="30" y="44" font-size="25" fill="#163f58" text-anchor="start">Pekeris 波导</text><text x="30" y="75" font-size="14" fill="#5e7d8e" text-anchor="start">理想均匀水层覆盖流体半空间；数值取值与吸收参数由具体算例给定。</text><rect x="80" y="135" width="640" height="166" fill="#def0f9"/><rect x="80" y="301" width="640" height="100" fill="#e9e1d0"/><line x1="80" y1="135" x2="720" y2="135" stroke="#428eaa" stroke-width="2" stroke-dasharray=""/><line x1="80" y1="301" x2="720" y2="301" stroke="#ad9065" stroke-width="2" stroke-dasharray=""/><text x="98" y="122" font-size="16" fill="#294c65" text-anchor="start">理想压力释放海面：p = 0</text><text x="120" y="187" font-size="20" fill="#294c65" text-anchor="start">水层：声速 c₁、密度 ρ₁、水深 H</text><circle cx="170" cy="243" r="8" fill="#2788a1"/><text x="194" y="249" font-size="18" fill="#294c65" text-anchor="start">声源深度 zₛ</text><text x="120" y="347" font-size="20" fill="#294c65" text-anchor="start">可穿透流体底：声速 c₂、密度 ρ₂</text><text x="120" y="382" font-size="16" fill="#294c65" text-anchor="start">界面处声压与法向质点速度连续</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>