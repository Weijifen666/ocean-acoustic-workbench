<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="积分变换与波数积分"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6994a8"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f9fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="30" y="44" font-size="25" fill="#163f58" text-anchor="start">积分变换与波数积分</text><text x="30" y="75" font-size="14" fill="#5e7d8e" text-anchor="start">示意的是方法结构；不是某个海域的实际谱、声场或误差曲线。</text><rect x="35" y="132" width="205" height="78" rx="12" fill="#fff" stroke="#347f9b"/><text x="137.5" y="163" font-size="19" fill="#347f9b" text-anchor="middle">空间声场 p(r,z)</text><text x="137.5" y="189" font-size="14" fill="#587486" text-anchor="middle">水平不变的分层环境</text><rect x="298" y="132" width="205" height="78" rx="12" fill="#fff" stroke="#347f9b"/><text x="400.5" y="163" font-size="19" fill="#347f9b" text-anchor="middle">谱域深度方程</text><text x="400.5" y="189" font-size="14" fill="#587486" text-anchor="middle">按水平波数逐点求解</text><rect x="560" y="132" width="205" height="78" rx="12" fill="#fff" stroke="#347f9b"/><text x="662.5" y="163" font-size="19" fill="#347f9b" text-anchor="middle">反变换重建</text><text x="662.5" y="189" font-size="14" fill="#587486" text-anchor="middle">得到距离—深度声场</text><line x1="247" y1="171" x2="287" y2="171" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="510" y1="171" x2="550" y2="171" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="400" y="271" font-size="20" fill="#294c65" text-anchor="middle">傅里叶 / Hankel 变换 → 深度边值问题 → 谱积分</text><text x="400" y="324" font-size="17" fill="#294c65" text-anchor="middle">矩阵法求解分层匹配；FFT 可加速合适的离散反变换。</text><text x="400" y="370" font-size="16" fill="#294c65" text-anchor="middle">波数间隔、截断和周期绕回误差须检查，不能只看图像平滑。</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>