294c65" text-anchor="middle">时域：声压 p(x,t)</text><text x="193" y="300" font-size="19" fill="#294c65" text-anchor="middle">∇²p − c⁻² ∂²p/∂t² = 0</text><line x1="357" y1="185" x2="440" y2="185" stroke="#6994a8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="397" y="161" font-size="14" fill="#294c65" text-anchor="middle">时间变换</text><rect x="465" y="144" width="285" height="78" rx="12" fill="#fff" stroke="#347f9b"/><text x="607.5" y="175" font-size="19" fill="#347f9b" text-anchor="middle">频域：P(x,ω)</text><text x="607.5" y="201" font-size="14" fill="#587486" text-anchor="middle">p = Re{P exp(−iωt)}</text><text x="607" y="300" font-size="21" fill="#294c65" text-anchor="middle">∇²P + k²P = 0</text><text x="400" y="370" font-size="16" fill="#294c65" text-anchor="middle">均匀、静止、线性介质；源项与边界条件另行给定。</text><line x1="30" y1="435" x2="770" y2="435" stroke="#d6e5ec" stroke-width="2" stroke-dasharray=""/><text x="30" y="461" font-size="13" fill="#6a8595" text-anchor="start">本项目原创原理示意 · 非教材原图 · 非求解器仿真结果</text></g></svg>